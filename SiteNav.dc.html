<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="fe-v2.css"/>
<script>
// In the editor/preview, pretty routes (/app, /sensor…) don't resolve — there is no
// rewrite server. Map them to the actual .dc.html files so every page is reachable.
(function () {
  if (window.__feRouteShim) return;
  window.__feRouteShim = true;
  var here = decodeURIComponent(location.pathname);
  if (!/\.html$/.test(here)) return; // live site (clean URLs): leave pretty routes alone
  var dir = here.slice(0, here.lastIndexOf("/") + 1);
  var map = {
    "/": "FaceoffEdge Home.dc.html",
    "/home": "FaceoffEdge Home.dc.html",
    "/app": "FaceoffEdge App.dc.html",
    "/sensor": "FaceoffEdge Sensor.dc.html",
    "/setup": "FaceoffEdge Setup.dc.html",
    "/buy": "FaceoffEdge Buy.dc.html",
    "/contact": "FaceoffEdge Contact.dc.html",
    "/faq": "FaceoffEdge FAQ.dc.html",
    "/info": "FaceoffEdge Info.dc.html",
    "/patents": "FaceoffEdge Patents.dc.html"
  };
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null;
    if (!a || a.target === "_blank") return;
    var href = a.getAttribute("href");
    if (!href || href.charAt(0) !== "/") return;
    var hash = "";
    var h = href.indexOf("#");
    if (h > -1) { hash = href.slice(h); href = href.slice(0, h) || "/"; }
    var file = map[href.replace(/\/$/, "") || "/"];
    if (!file) return;
    e.preventDefault();
    location.href = dir + encodeURIComponent(file) + hash;
  }, true);
})();
</script>
</helmet>

<div style="font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;">
  <nav class="fe-nav" data-nav>
    <div data-r="pad" style="height:100%; max-width:75rem; margin:0 auto; padding:0 1.75rem; display:flex; align-items:center; gap:1.125rem;">
      <button data-r="burger" type="button" aria-label="Open menu" aria-expanded="{{ menuOpen }}" onClick="{{ toggleMenu }}" style="display:none; flex-direction:column; justify-content:center; align-items:center; gap:.375rem; width:2.75rem; height:2.75rem; margin-left:-.75rem; background:none; border:none; cursor:pointer; flex-shrink:0;">
        <span style="display:block; width:1.125rem; height:1.5px; border-radius:2px; background:#F5F7FA;"></span>
        <span style="display:block; width:1.125rem; height:1.5px; border-radius:2px; background:#F5F7FA;"></span>
      </button>
      <a href="/" style="display:flex; align-items:center; gap:.5625rem;">
        <img src="assets/logo.png" alt="FaceoffEdge logo" width="28" height="28" style="width:1.75rem; height:1.75rem; border-radius:.4375rem; display:block;"/>
        <img src="assets/wordmark.png" alt="FaceoffEdge" style="height:1.0625rem; width:auto; display:block;"/>
      </a>
      <div data-r="nav-links" style="display:flex; gap:.125rem; margin-left:.75rem;">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="7">
          <a class="{{ l.cls }}" href="{{ l.href }}">{{ l.label }}</a>
        </sc-for>
      </div>
      <div style="flex:1;"></div>
      <a class="fe-badge" data-r="nav-appstore" href="https://apps.apple.com/us/app/faceoffedge/id6770716883" target="_blank" rel="noopener" aria-label="Download on the App Store" style="flex-shrink:0; border-radius:.5625rem;"><img src="assets/app-store-badge.png" alt="Download on the App Store" style="display:block; height:2.125rem; width:auto; border-radius:.5625rem; box-shadow:0 0 0 2px #fff;"></a>
    </div>
  </nav>

  <div data-backdrop onClick="{{ closeMenu }}" style="{{ backdropStyle }}"></div>
  <aside data-drawer class="{{ drawerClass }}" aria-label="Mobile navigation" aria-hidden="{{ drawerHidden }}" style="{{ drawerStyle }}">
    <img src="assets/logo.png" alt="FaceoffEdge logo" width="48" height="48" style="width:3rem; height:3rem; border-radius:.6875rem; margin:0 0 1.625rem .75rem; display:block;"/>
    <sc-for list="{{ links }}" as="l" hint-placeholder-count="7">
      <a class="{{ l.dcls }}" href="{{ l.href }}" onClick="{{ closeMenu }}">{{ l.label }}</a>
    </sc-for>
  </aside>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;app&quot;,&quot;sensor&quot;,&quot;setup&quot;,&quot;preorder&quot;,&quot;buy&quot;,&quot;faq&quot;,&quot;contact&quot;,&quot;info&quot;,&quot;patents&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { menu: false };

  componentDidMount() {
    try {
      // iOS only fires :active (instant press feedback) if a touch listener exists.
      document.addEventListener("touchstart", function () {}, { passive: true });

      // Soft scroll-edge fade under the nav once content scrolls beneath it.
      this._onScroll = () => {
        const y = window.pageYOffset || document.documentElement.scrollTop || 0;
        const nav = document.querySelector("[data-nav]");
        if (nav) nav.style.setProperty("--edge", y > 8 ? "1" : "0");
      };
      window.addEventListener("scroll", this._onScroll, { passive: true });
      this._onScroll();

      this._onKey = (e) => { if (e.key === "Escape" && this.state.menu) this.setState({ menu: false }); };
      document.addEventListener("keydown", this._onKey);

      this._bindDrawer();
    } catch (e) {}
  }

  componentWillUnmount() {
    try {
      if (this._onScroll) window.removeEventListener("scroll", this._onScroll);
      if (this._onKey) document.removeEventListener("keydown", this._onKey);
    } catch (e) {}
  }

  // Swipe the mobile menu closed: 1:1 with the finger after a 10px hysteresis,
  // rubber-band past the open edge, and on release project the momentum to decide open vs closed.
  _bindDrawer() {
    const el = document.querySelector("[data-drawer]");
    if (!el) return;
    let st = null;
    const W = () => el.offsetWidth || 300;
    const project = (v, d) => (v / 1000) * d / (1 - d);
    const rubber = (o, dim) => (o * dim * 0.55) / (dim + 0.55 * Math.abs(o));
    const bd = () => document.querySelector("[data-backdrop]");

    el.addEventListener("pointerdown", (e) => {
      if (!this.state.menu) return;
      const b = bd();
      st = { id: e.pointerId, x0: e.clientX, y0: e.clientY, live: false,
             hist: [{ x: e.clientX, t: performance.now() }],
             tr: el.style.transition, btr: b ? b.style.transition : "" };
    });

    el.addEventListener("pointermove", (e) => {
      if (!st || e.pointerId !== st.id) return;
      const b = bd();
      if (!st.live) {
        const dx0 = e.clientX - st.x0, dy0 = e.clientY - st.y0;
        if (Math.abs(dx0) < 10 && Math.abs(dy0) < 10) return;
        if (Math.abs(dy0) > Math.abs(dx0)) { st = null; return; }
        st.live = true;
        st.x0 = e.clientX;
        try { el.setPointerCapture(e.pointerId); } catch (_) {}
        el.style.transition = "none";
        if (b) b.style.transition = "none";
      }
      const raw = e.clientX - st.x0;
      const x = raw <= 0 ? raw : rubber(raw, W());
      el.style.transform = "translateX(" + x + "px)";
      if (b) b.style.opacity = String(Math.max(0, 1 + Math.min(0, x) / W()));
      st.hist.push({ x: e.clientX, t: performance.now() });
      if (st.hist.length > 6) st.hist.shift();
    });

    const end = (e) => {
      if (!st || e.pointerId !== st.id) return;
      const s = st; st = null;
      if (!s.live) return;
      const b = bd();
      const raw = Math.min(0, e.clientX - s.x0);
      const a = s.hist[0], z = s.hist[s.hist.length - 1];
      const v = z.t > a.t ? ((z.x - a.x) / (z.t - a.t)) * 1000 : 0;
      const projected = raw + project(v, 0.998);
      el.style.transition = s.tr;
      if (b) b.style.transition = s.btr;
      if (projected < -W() * 0.5) {
        this.setState({ menu: false });
      } else {
        el.style.transform = "translateX(0)";
        if (b) b.style.opacity = "1";
      }
    };
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
  }

  renderVals() {
    const menu = this.state.menu;
    const active = this.props.active || "home";
    const items = [
      ["home", "Home", "/"],
      ["app", "App", "/app"],
      ["sensor", "Sensor", "/sensor"],
      ["setup", "Setup", "/setup"],
      ["buy", "Reserve sensor", "/buy"],
      ["contact", "Contact us", "/contact"],
      ["faq", "FAQ", "/faq"]
    ];
    return {
      menuOpen: menu,
      drawerHidden: !menu,
      drawerClass: menu ? "fe-open" : "",
      links: items.map(([id, label, href]) => ({
        label, href,
        cls: id === active ? "fe-nl fe-nl-on" : "fe-nl",
        dcls: id === active ? "fe-dl fe-dl-on" : "fe-dl"
      })),
      backdropStyle: `position:fixed; inset:0; z-index:60; background:rgba(0,0,0,0.5); opacity:${menu ? 1 : 0}; visibility:${menu ? 'visible' : 'hidden'}; transition:opacity .4s cubic-bezier(.16,1,.3,1), visibility 0s linear ${menu ? '0s' : '.4s'};`,
      drawerStyle: `transform:translateX(${menu ? '0' : '-105%'}); visibility:${menu ? 'visible' : 'hidden'}; transition:transform .45s cubic-bezier(.16,1,.3,1), visibility 0s linear ${menu ? '0s' : '.45s'};`,
      toggleMenu: () => this.setState(s => ({ menu: !s.menu })),
      closeMenu: () => this.setState({ menu: false })
    };
  }
}

</script>
</body>
</html>
