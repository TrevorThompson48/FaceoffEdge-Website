<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>FaceoffEdge — Coming Soon</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&display=swap');
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05080F;color:#fff;font-family:'JetBrains Mono',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;position:relative;overflow:hidden}
body::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(59,110,242,0.14),transparent 60%);pointer-events:none}
.logo{width:88px;height:88px;object-fit:contain;margin-bottom:32px;position:relative}
.wordmark{font-family:'Archivo',sans-serif;font-weight:900;text-transform:uppercase;font-size:clamp(36px,7vw,64px);line-height:0.95;letter-spacing:-0.01em;position:relative}
.wordmark span{color:#3B6EF2}
.tagline{margin-top:18px;font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.5);position:relative}
.message{margin-top:40px;max-width:480px;font-size:15px;line-height:1.7;color:rgba(255,255,255,0.65);position:relative}
.signup{margin-top:36px;display:flex;gap:10px;position:relative}
.signup input{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);border-radius:6px;padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:14px;color:#fff;width:260px}
.signup input::placeholder{color:rgba(255,255,255,0.35)}
.signup input:focus{outline:none;border-color:rgba(59,110,242,0.5)}
.signup button{background:#3B6EF2;border:none;border-radius:6px;padding:12px 20px;font-family:'JetBrains Mono',monospace;font-weight:600;font-size:14px;color:#fff;cursor:pointer}
.signup button:hover{background:#2f5adb}
.signup-note{margin-top:14px;font-size:12px;color:rgba(255,255,255,0.4);position:relative}
@media (max-width:520px){.signup{flex-direction:column;align-items:center}.signup input{width:260px}}
.footer{margin-top:56px;font-size:12px;letter-spacing:0.08em;color:rgba(255,255,255,0.3);position:relative}
</style>
</head>
<body>
<img class="logo" src="assets/logo.png?v=3" alt="FaceoffEdge logo"/>
<div class="wordmark">FACEOFF<span>EDGE</span></div>
<div class="tagline">Lacrosse faceoff training instrumented</div>
<p class="message">In the works. Were heads down building... check back soon.</p>
<form class="signup" id="signup-form" onsubmit="return submitSignup(event)">
<input type="email" id="signup-email" placeholder="you@email.com" required/>
<button type="submit">Join email list</button>
</form>
<div class="signup-note" id="signup-note">Be the first to know when we launch.</div>
<div class="footer">© 2026 FaceoffEdge</div>
<script>
async function submitSignup(e){
e.preventDefault();
const email=document.getElementById('signup-email').value;
const note=document.getElementById('signup-note');
const btn=document.querySelector('#signup-form button');
btn.disabled=true;btn.textContent='Joining…';
try{
await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({access_key:'5d700d60-75a3-42f3-b160-d00175db77c8',subject:'New coming-soon email signup',from_name:'FaceoffEdge Coming Soon',email:email,message:'Email list signup: '+email})});
}catch(err){}
document.getElementById('signup-form').style.display='none';
note.textContent="You're on the list — we'll be in touch.";
return false;
}
</script>
</body>
</html>
