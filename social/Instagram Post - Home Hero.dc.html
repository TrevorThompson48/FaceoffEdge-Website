<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Archivo+Black&display=swap" rel="stylesheet"/>
<style>
  html, body { margin:0; padding:0; background:#05080F; color:#F2F4F8; -webkit-font-smoothing:antialiased; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  * { box-sizing:border-box; }
  a { color:#3B6EF2; text-decoration:none; }
  a:hover { color:#7FA0FF; }
</style>
</helmet>
<div style="position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#1a1d24; overflow:hidden;">
<div style="width:{{ boxW }}; height:{{ boxH }}; flex-shrink:0; position:relative;">
<section data-screen-label="ig-post" style="position:absolute; left:0; top:0; width:1080px; height:1350px; overflow:hidden; background:#05080F; display:flex; transform-origin:0 0; transform:{{ scaleT }};">
  <img src="{{ heroSrc }}" alt="FaceoffEdge sensor clipped to a shaft on the field" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:58% 34%;"/>
  <div style="position:absolute; inset:0; background:linear-gradient(180deg, rgba(5,8,15,0.50) 0%, rgba(5,8,15,0.02) 42%, rgba(5,8,15,0.42) 78%, #05080F 100%);"></div>
  <div style="position:absolute; inset:0; background:linear-gradient(90deg, rgba(5,8,15,0.50) 0%, rgba(5,8,15,0.02) 54%, rgba(5,8,15,0) 100%);"></div>

  <div style="position:relative; width:100%; padding:64px 66px 40px; display:flex; flex-direction:column;">
    <div style="display:flex; align-items:center; gap:30px; min-width:0; margin:0 -30px;">
      <img src="{{ logoSrc }}" alt="FaceoffEdge logo" style="display:block; width:190px; height:auto; border-radius:44px; flex-shrink:0;"/>
      <img src="{{ wordSrc }}" alt="FaceoffEdge" style="display:block; flex:1; min-width:0; width:100%; height:auto;"/>
    </div>
    <div style="flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center; padding:40px 0;">
      <h1 style="margin:0 0 300px; font-family:'Archivo Black',sans-serif; font-size:74px; white-space:nowrap; line-height:1.0; letter-spacing:-0.03em; text-transform:uppercase; text-wrap:balance; color:#FFFFFF;">For lacrosse<br/>faceoff specialists</h1>
    </div>
    <div style="padding:0 66px;">
      <div style="margin:0 0 24px; font-family:'Archivo Black',sans-serif; font-size:50px; line-height:1.1; letter-spacing:-0.02em; text-transform:uppercase; color:#C4CBDA;">
        Real data.<br/><span style="color:#C4CBDA;">Real results.</span>
      </div>
      <p style="margin:0; font-size:44px; line-height:1.5; color:#C4CBDA; text-wrap:pretty;">
        FaceoffEdge&trade; is a stick-mounted system that measures every millisecond
        between the whistle and the clamp. Stop guessing. Your data is right there.
      </p>
    </div>
  </div>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>class Component extends DCLogic {
  state = { s: 0.5, heroSrc: '../assets/hero-sensor-web-v3.png', logoSrc: '../assets/logo.png', wordSrc: '../assets/wordmark.png' };
  toData = async (url) => { const b = await (await fetch(url)).blob(); return await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); }); };
  async inline() {
    try {
      const [h, l, w] = await Promise.all(['../assets/hero-sensor-web-v3.png','../assets/logo.png','../assets/wordmark.png'].map(this.toData));
      this.setState({ heroSrc: h, logoSrc: l, wordSrc: w });
    } catch (e) {}
  }
  fit = () => {
    const s = Math.min((window.innerWidth - 48) / 1080, (window.innerHeight - 48) / 1350, 1);
    this.setState({ s: Math.max(s, 0.1) });
  };
  componentDidMount() { this.inline(); this.fit(); window.addEventListener('resize', this.fit); }
  componentWillUnmount() { window.removeEventListener('resize', this.fit); }
  renderVals() {
    const s = this.state.s;
    return { heroSrc: this.state.heroSrc, logoSrc: this.state.logoSrc, wordSrc: this.state.wordSrc, scaleT: `scale(${s})`, boxW: `${1080 * s}px`, boxH: `${1350 * s}px` };
  }
}</script>
</body>
</html>
